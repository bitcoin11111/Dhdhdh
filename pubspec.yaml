name: shieldvpn
description: ShieldVPN - Auto-switching VPN client with battery optimization
publish_to: 'none'
version: 1.1.0+43

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.0
  http: ^1.1.0
  web_socket_channel: ^2.4.0

  # VPN / Proxy
  flutter_vpn: ^0.2.0

  # Background tasks
  workmanager: ^0.5.2
  background_fetch: ^1.3.2

  # Notifications
  flutter_local_notifications: ^16.3.2

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # QR / Scanning
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0

  # UI
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  fl_chart: ^0.66.0

  # Utils
  url_launcher: ^6.2.4
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  connectivity_plus: ^5.0.2
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1
  permission_handler: ^11.2.0
  battery_plus: ^5.0.2
  network_info_plus: ^4.0.2

  # Internationalization
  intl: ^0.18.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/configs/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
